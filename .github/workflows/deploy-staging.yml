name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    environment: staging
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Periksa konfigurasi deployment
        id: config
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment dilewati: secret Vercel staging belum dikonfigurasi.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - run: npx --yes vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        if: steps.config.outputs.ready == 'true'
      - run: npx --yes vercel build --token="$VERCEL_TOKEN"
        if: steps.config.outputs.ready == 'true'
      - run: npx --yes vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        if: steps.config.outputs.ready == 'true'
