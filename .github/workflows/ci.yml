name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sewamates_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sewamates_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Create isolated transaction E2E database
        run: node -e "const {Client}=require('pg');const c=new Client({connectionString:process.env.TEST_DATABASE_URL});c.connect().then(()=>c.query('CREATE DATABASE sewamates_e2e')).finally(()=>c.end())"
      - run: npm run build
        env:
          NEXT_BUILD_DIR: .next-e2e
          NEXT_PUBLIC_APP_URL: http://localhost:3100
      - run: npm run test:e2e:transactions
        env:
          NEXT_BUILD_DIR: .next-e2e
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sewamates_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
